- name: Update Fedora servers
  hosts: fedora_servers
  become: true
  gather_facts: false
  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
        update_only: true
        allowerasing: false
        skip_broken: true
      register: dnf_upgrade

    - name: Show updated DNF packages
      ansible.builtin.debug:
        msg: "{{ dnf_upgrade.results | default(['No DNF package changes reported.']) }}"
